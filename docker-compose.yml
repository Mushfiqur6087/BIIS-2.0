# ─────────────────────────────────────────────────────────────────────────────
# BIIS 2.0 — Docker Compose
#
# Services:
#   oracle   — Oracle Database Free 23ai
#   app      — Express REST API backend  (port 3000)
#   frontend — SvelteKit frontend        (port 5173 dev / 3001 preview)
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Oracle Database ──────────────────────────────────────────────────────
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: biis-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-SysOracle#2024}
      BIIS_DB_PASS: ${DB_PASS:-BiisPass#2024}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle-init.sh:/container-entrypoint-initdb.d/oracle-init.sh:ro
      - ./backend/ProjectEssentials/Database/BIIS_STRUCTURE.sql:/opt/biis/sql/BIIS_STRUCTURE.sql:ro
      - ./backend/ProjectEssentials/Database/DEPARTMENT.sql:/opt/biis/sql/DEPARTMENT.sql:ro
      - ./backend/ProjectEssentials/Database/DUES.sql:/opt/biis/sql/DUES.sql:ro
      - ./backend/ProjectEssentials/Database/SCHOLARSHIP.sql:/opt/biis/sql/SCHOLARSHIP.sql:ro
      - ./backend/ProjectEssentials/Database/STUDENT.sql:/opt/biis/sql/STUDENT.sql:ro
      - ./backend/ProjectEssentials/Database/TEACHER.sql:/opt/biis/sql/TEACHER.sql:ro
      - ./backend/ProjectEssentials/Database/COURSE.sql:/opt/biis/sql/COURSE.sql:ro
      - ./backend/ProjectEssentials/Database/USER_TABLE.sql:/opt/biis/sql/USER_TABLE.sql:ro
      - ./backend/ProjectEssentials/Database/ADVISOR.sql:/opt/biis/sql/ADVISOR.sql:ro
      - ./backend/ProjectEssentials/Database/ENROLLMENT.sql:/opt/biis/sql/ENROLLMENT.sql:ro
      - ./backend/ProjectEssentials/Database/REGISTRATION.sql:/opt/biis/sql/REGISTRATION.sql:ro
      - ./backend/ProjectEssentials/Database/RESULT.sql:/opt/biis/sql/RESULT.sql:ro
      - ./backend/ProjectEssentials/Database/TEACHES.sql:/opt/biis/sql/TEACHES.sql:ro
      - ./backend/ProjectEssentials/Database/NOTIFICATION.sql:/opt/biis/sql/NOTIFICATION.sql:ro
      - ./backend/ProjectEssentials/Database/STUDENT_DUES.sql:/opt/biis/sql/STUDENT_DUES.sql:ro
      - ./backend/ProjectEssentials/Database/STUDENT_SCHOLARSHIP.sql:/opt/biis/sql/STUDENT_SCHOLARSHIP.sql:ro
      - ./backend/ProjectEssentials/Database/ADMIN_LOGS.sql:/opt/biis/sql/ADMIN_LOGS.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 25
      start_period: 90s

  # ── Express REST API Backend ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biis-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_USER: BIIS
      DB_PASS: ${DB_PASS:-BiisPass#2024}
      DB_CONNECTION: oracle:1521/FREEPDB1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ./backend/public/img:/app/public/img
      - ./backend/docs:/app/docs
      - ./backend/logs:/app/logs
      - ./backend/ProjectEssentials/CSV:/app/ProjectEssentials/CSV

  # ── SvelteKit Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: biis-frontend
    restart: unless-stopped
    ports:
      - "5173:3000"
    environment:
      ORIGIN: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - app

volumes:
  oracle_data:
    name: biis_oracle_data
