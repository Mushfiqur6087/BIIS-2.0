# ─────────────────────────────────────────────────────────────────────────────
# BIIS 2.0 — Docker Compose
#
# Services:
#   oracle  — Oracle Database Free 23ai (gvenzl/oracle-free)
#   app     — Node.js / Express application
#
# First-run behavior:
#   The oracle service detects an empty data volume and runs:
#     docker/oracle-init.sh  → creates BIIS user + loads SQL schema + seed data
#   Subsequent starts skip init and boot in ~15 seconds.
#
# Usage:
#   cp .env.example .env        # fill in your secrets
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Oracle Database ──────────────────────────────────────────────────────
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: biis-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-SysOracle#2024}
      # BIIS_DB_PASS is a custom name — avoids triggering gvenzl's built-in
      # user-creation logic (which requires APP_USER + APP_USER_PASSWORD together).
      # oracle-init.sh reads this variable to create the BIIS schema user.
      BIIS_DB_PASS: ${DB_PASS:-BiisPass#2024}
    ports:
      - "1521:1521"         # expose for local SQL clients (optional)
    volumes:
      # Persist DB data across container restarts
      - oracle_data:/opt/oracle/oradata
      # Init scripts — only run on very first startup (empty volume)
      - ./docker/oracle-init.sh:/container-entrypoint-initdb.d/oracle-init.sh:ro
      # SQL files mounted to a neutral path — only oracle-init.sh runs them.
      # DO NOT mount to /docker-entrypoint-initdb.d/ as gvenzl auto-executes
      # everything there, which would DROP+recreate tables and wipe seed data.
      - ./Project/ProjectEssentials/Database/BIIS_STRUCTURE.sql:/opt/biis/sql/BIIS_STRUCTURE.sql:ro
      # Individual per-table seed data files (real INSERT data):
      - ./Project/ProjectEssentials/Database/DEPARTMENT.sql:/opt/biis/sql/DEPARTMENT.sql:ro
      - ./Project/ProjectEssentials/Database/DUES.sql:/opt/biis/sql/DUES.sql:ro
      - ./Project/ProjectEssentials/Database/SCHOLARSHIP.sql:/opt/biis/sql/SCHOLARSHIP.sql:ro
      - ./Project/ProjectEssentials/Database/STUDENT.sql:/opt/biis/sql/STUDENT.sql:ro
      - ./Project/ProjectEssentials/Database/TEACHER.sql:/opt/biis/sql/TEACHER.sql:ro
      - ./Project/ProjectEssentials/Database/COURSE.sql:/opt/biis/sql/COURSE.sql:ro
      - ./Project/ProjectEssentials/Database/USER_TABLE.sql:/opt/biis/sql/USER_TABLE.sql:ro
      - ./Project/ProjectEssentials/Database/ADVISOR.sql:/opt/biis/sql/ADVISOR.sql:ro
      - ./Project/ProjectEssentials/Database/ENROLLMENT.sql:/opt/biis/sql/ENROLLMENT.sql:ro
      - ./Project/ProjectEssentials/Database/REGISTRATION.sql:/opt/biis/sql/REGISTRATION.sql:ro
      - ./Project/ProjectEssentials/Database/RESULT.sql:/opt/biis/sql/RESULT.sql:ro
      - ./Project/ProjectEssentials/Database/TEACHES.sql:/opt/biis/sql/TEACHES.sql:ro
      - ./Project/ProjectEssentials/Database/NOTIFICATION.sql:/opt/biis/sql/NOTIFICATION.sql:ro
      - ./Project/ProjectEssentials/Database/STUDENT_DUES.sql:/opt/biis/sql/STUDENT_DUES.sql:ro
      - ./Project/ProjectEssentials/Database/STUDENT_SCHOLARSHIP.sql:/opt/biis/sql/STUDENT_SCHOLARSHIP.sql:ro
      - ./Project/ProjectEssentials/Database/ADMIN_LOGS.sql:/opt/biis/sql/ADMIN_LOGS.sql:ro
    healthcheck:
      # gvenzl images ship with a built-in healthcheck.sh
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 25          # Oracle Free can take up to ~3 min on first boot
      start_period: 90s

  # ── Node.js Application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biis-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # DB credentials — must match what oracle-init.sh created
      DB_USER: BIIS
      DB_PASS: ${DB_PASS:-BiisPass#2024}
      # oracledb Thin mode Easy Connect string
      DB_CONNECTION: oracle:1521/FREEPDB1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
    depends_on:
      oracle:
        condition: service_healthy   # waits until Oracle passes its health check
    volumes:
      # Persist uploaded images and generated PDFs
      - ./Project/public/img:/app/public/img
      - ./Project/docs:/app/docs
      - ./Project/logs:/app/logs
      # Make CSV upload directory accessible
      - ./Project/ProjectEssentials/CSV:/app/ProjectEssentials/CSV

volumes:
  oracle_data:
    name: biis_oracle_data
